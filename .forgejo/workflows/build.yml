# Lentovodets — tape backup system (LTO archiver with catalog and Web UI)
# CI: build + test pipeline. Structure mirrors the Intermasq build workflow.

name: Build and Test Lentovodets

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Upload binary to Forgejo Packages and Release on success?"
        required: true
        default: false
        type: boolean
      publish_github:
        description: "Create GitHub Release and upload binary assets?"
        required: true
        default: false
        type: boolean
      publish_codeberg:
        description: "Create Codeberg Release and upload binary assets?"
        required: true
        default: false
        type: boolean
      version_tag:
        description: "Fallback version when HEAD has no exact v* tag."
        required: false
        default: ""
        type: string
      run_race_tests:
        description: "Run go test with -race (slower, more thorough)?"
        required: true
        default: true
        type: boolean
      run_e2e_tests:
        description: "Run Playwright E2E (tests/e2e)? Installs chromium; opt-in."
        required: true
        default: false
        type: boolean

jobs:
  build-test:
    runs-on: docker
    container:
      # Образ — через Nora-зеркало docker.io/library (как в bin_build)
      image: nora.panelka.yadr01.internal/library/fedora:44
    env:
      # All external dependencies via Nora where possible
      GOPROXY: "https://nora.panelka.yadr01.internal/go,direct"
      GOSUMDB: "off"
      GOPRIVATE: "git.yadr00.internal/*"
      # NOTE: do NOT set SSL_CERT_FILE / NODE_EXTRA_CA_CERTS to step-ca.crt
      # directly — that overrides the system bundle and breaks public-CA
      # trust (curl to go.dev / npm / etc fails with "unexpected end of file").
      # The 'update-ca-trust' step adds step-ca to the system bundle, after
      # which all tools trust both public CAs AND step-ca transparently.

    steps:
      - name: Install git first (minimal fedora image lacks it)
        run: dnf install -y --setopt=install_weak_deps=False git curl

      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Configure Khrazhevnik RPM repos (dogfood)
        # DNF дальше ходит ТОЛЬКО через Хражевник: дефолтные fedora*.repo
        # (metalink на внешние зеркала) удаляются — база образа запинена на
        # fedora:44, khrz-ремоуты тоже F44 (паттерн build-test Хражевника).
        # Bootstrap-шаг выше (git+curl) неизбежно идёт мимо кеша: без curl
        # не достать roots.pem step-ca для доверия к инстансу.
        # gpgcheck=0 — passthrough чужих подписей байтово (инвариант кеша).
        # zchunk=False: dnf5 падает на .zck-метаданных через прокси
        # («primary data not present», проверено на F44/dnf5) — качаем .gz.
        run: |
          rm -f /etc/yum.repos.d/fedora*.repo
          cat > /etc/yum.repos.d/khrz.repo << 'EOF'
          [khrz-fedora]
          name=Khrazhevnik Fedora 44 (release)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/rpm/fedora/
          gpgcheck=0
          enabled=1
          sslverify=1
          zchunk=False
          EOF
          cat > /etc/yum.repos.d/khrz-updates.repo << 'EOF'
          [khrz-fedora-updates]
          name=Khrazhevnik Fedora 44 (updates)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/rpm/fedora-updates/
          gpgcheck=0
          enabled=1
          sslverify=1
          zchunk=False
          EOF

      - name: Install remaining system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash tar \
            nodejs npm \
            jq \
            gcc

      - name: Install Go toolchain
        run: |
          # Fedora 44 ships an older Go; lentovodets needs 1.26.1+ (go.mod).
          # Tarball from go.dev. -f: fail on HTTP errors (don't pipe HTML
          # error page into tar). Download first, then extract, so we get a
          # clear error if URL is wrong.
          curl -fsSL https://go.dev/dl/go1.26.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
          ls -lh /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          /usr/local/go/bin/go version

      - name: Configure npm registry to Nora
        run: npm config set registry https://nora.panelka.yadr01.internal/npm/

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Run the manual workflow from the selected tag/ref and keep tags
          # available for exact version detection below.
          fetch-depth: 0

      - name: Determine build version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version_tag }}
          SHA: ${{ github.sha }}
        run: |
          TAG_VERSION="$(git describe --exact-match --tags --match='v*' HEAD 2>/dev/null || true)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
            echo "Using exact Git tag: $VERSION"
          elif [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
            echo "HEAD has no exact v* tag; using workflow input: $VERSION"
          else
            VERSION="sha-${SHA:0:8}"
            echo "HEAD has no exact v* tag and no input; using: $VERSION"
          fi

          case "$VERSION" in
            v[0-9]*|sha-[0-9a-f]*) ;;
            *) echo "::error::invalid version '$VERSION' (expected v* or sha-<hex>)"; exit 1 ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "EXACT_TAG=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        # MUST run before any Go command: internal/iface/web/assets/ is not
        # committed (see .gitignore) and //go:embed assets fails to compile
        # until Vite emits the bundle there.
        run: cd web && npm ci && npm run build

      - name: Build binary
        # -tags tape: релизный бинарь обязан уметь реальный стример
        # (/dev/nst*); сборка с тегом на linux/amd64 всё равно использует
        # filetape для путей-файлов (dev/CI/e2e не затронуты).
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -tags tape -trimpath \
            -ldflags="-s -w -X lentovodec/cmd/lentovodec.Version=${APP_VERSION}" \
            -o lentovodec-ci ./cmd/lentovodec

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          FMT_OUT="$(gofmt -l .)"
          if [ -n "$FMT_OUT" ]; then
            echo "::error::Files need gofmt:"
            echo "$FMT_OUT"
            exit 1
          fi

      - name: Go tests (unit + integration)
        env:
          RACE_FLAG: ${{ github.event.inputs.run_race_tests == 'true' && '-race' || '' }}
          # -race requires CGO (and gcc). The binary itself is built with
          # CGO_ENABLED=0 for static linking (modernc.org/sqlite is pure Go);
          # tests opt back in here.
          CGO_ENABLED: "1"
        run: |
          echo "Running: go test ./... $RACE_FLAG -count=1"
          go test ./... $RACE_FLAG -count=1

      - name: Coverage report
        # Separate step (no -race) so instrumentation overhead & race detector
        # don't skew numbers. Informational only — thresholds live in
        # docs/TESTING.md §4 and are tracked per-stage in ROADMAP notes
        # (current: total 87.5%, iface/cli+web pull it down by design).
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./... -count=1 -coverprofile coverage.out
          echo "===== Coverage summary ====="
          go tool cover -func coverage.out | tail -n 1
          echo "===== Per-package ====="
          go tool cover -func coverage.out | grep -E '^lentovodec/' | sort

      - name: Playwright E2E (opt-in)
        # tests/e2e поднимает собственного демона на filetape-ленте и сам
        # сеет данные (format → job → full backup). Бинарь и web-бандл уже
        # собраны предыдущими шагами — global-setup пропускает сборку
        # (E2E_SKIP_BUILD + E2E_LENTOVODEC_BIN).
        #
        # Герметичность (паттерн Хражевника): браузер — системный
        # chromium-headless из fedora-репо через khrz (dnf), а НЕ
        # `npx playwright install` (тот качает билд с cdn.playwright.dev
        # мимо кеша — дыра). Дерево shared-lib-депсов ставит сам dnf.
        # Бинарь пакета — /usr/lib64/chromium-browser/headless_shell
        # (файллист F44); путь передаётся Playwright'у через
        # E2E_CHROMIUM_EXECUTABLE (launchOptions в playwright.config.ts).
        if: success() && github.event.inputs.run_e2e_tests == 'true'
        run: |
          dnf install -y --setopt=install_weak_deps=False chromium-headless
          E2E_CHROMIUM_EXECUTABLE="$(rpm -ql chromium-headless | grep -E 'headless_shell$' | head -n1 || true)"
          test -n "$E2E_CHROMIUM_EXECUTABLE" && test -x "$E2E_CHROMIUM_EXECUTABLE" \
            || { echo "::error::headless_shell not found in chromium-headless"; exit 1; }
          echo "Using browser: $E2E_CHROMIUM_EXECUTABLE"
          export E2E_CHROMIUM_EXECUTABLE
          BIN="$PWD/lentovodec-ci"
          cd tests/e2e
          npm ci
          E2E_SKIP_BUILD=1 E2E_LENTOVODEC_BIN="$BIN" npx playwright test

      - name: Show binary info
        run: |
          ls -lh lentovodec-ci
          ARTIFACT_NAME="lentovodets-${VERSION}-linux-amd64"
          cp lentovodec-ci "$ARTIFACT_NAME"
          sha256sum "$ARTIFACT_NAME" | tee "${ARTIFACT_NAME}.sha256"

      - name: Publish to Forgejo Packages
        if: success() && github.event.inputs.push_to_registry == 'true'
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          echo "Publishing as version: $VERSION"
          ARTIFACT_NAME="lentovodets-${VERSION}-linux-amd64"

          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"

          # Generic package registry: каждый файл по своему пути.
          for FILE in $PUBLISH_FILES; do
            curl -fSR --cacert /etc/pki/ca-trust/source/anchors/step-ca.crt \
                 --user "alexrus:${UPLOAD_TOKEN}" \
                 --upload-file "./${FILE}" \
                 "https://git.yadr00.internal/api/packages/AlexRus1234/generic/lentovodets/${VERSION}/${FILE}"
          done
          echo "Published Forgejo packages: $PUBLISH_FILES"

          API="https://git.yadr00.internal/api/v1/repos/AlexRus1234/Lentovodets"
          RELEASE_ID="$(curl -fsSL --user "alexrus:${UPLOAD_TOKEN}" \
            "$API/releases/tags/${VERSION}" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$RELEASE_ID" ]; then
            BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
            RELEASE="$(curl -fsSL -X POST \
              --user "alexrus:${UPLOAD_TOKEN}" \
              -H 'Content-Type: application/json' \
              "$API/releases" -d "$BODY")"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE")"
            test -n "$RELEASE_ID" && test "$RELEASE_ID" != "null"
          else
            echo "Release ${VERSION} already exists (id=${RELEASE_ID}), reusing"
          fi
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              --user "alexrus:${UPLOAD_TOKEN}" \
              -F "attachment=@${FILE}" \
              "$API/releases/${RELEASE_ID}/assets?name=${FILE}"
          done
          echo "Published local Forgejo Release ${VERSION}"

      - name: Publish GitHub Release
        if: success() && github.event.inputs.publish_github == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          if [ "$EXACT_TAG" != "$VERSION" ]; then
            echo "::error::GitHub Release requires HEAD to have the exact tag $VERSION"
            exit 1
          fi
          ARTIFACT_NAME="lentovodets-${VERSION}-linux-amd64"
          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"
          API="https://api.github.com/repos/AlexRus1234/Lentovodets"
          BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
          RELEASE="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "$API/releases" -d "$BODY")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE" | sed 's/{?name,label}//')"
          test -n "$UPLOAD_URL" && test "$UPLOAD_URL" != "null"
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${RELEASE_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${FILE}" \
              "${UPLOAD_URL}?name=${FILE}"
          done
          echo "Published GitHub Release ${VERSION} (files: $PUBLISH_FILES)"

      - name: Publish Codeberg Release
        if: success() && github.event.inputs.publish_codeberg == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.TOKEN_CODEBERG }}
        run: |
          if [ "$EXACT_TAG" != "$VERSION" ]; then
            echo "::error::Codeberg Release requires HEAD to have the exact tag $VERSION"
            exit 1
          fi
          ARTIFACT_NAME="lentovodets-${VERSION}-linux-amd64"
          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"
          API="https://codeberg.org/api/v1/repos/AlexRus1234/Lentovodets"
          BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
          RELEASE="$(curl -fsSL -X POST \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$API/releases" -d "$BODY")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE")"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != "null"
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -F "attachment=@${FILE}" \
              "$API/releases/${RELEASE_ID}/assets?name=${FILE}"
          done
          echo "Published Codeberg Release ${VERSION} (files: $PUBLISH_FILES)"

      - name: Cleanup
        if: always()
        run: |
          rm -f lentovodec-ci \
                lentovodets-*linux-amd64 lentovodets-*linux-amd64.sha256 \
                coverage.out
